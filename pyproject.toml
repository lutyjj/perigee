[project]
name = "perigee"
version = "0.2.1" # x-release-please-version
description = "Decky Loader backend that mirrors paired Moonshine hosts into Steam"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
pythonpath = ["py_modules"]
testpaths = ["tests/backend"]

[tool.mypy]
python_version = "3.11"
mypy_path = "py_modules:stubs"
files = ["py_modules", "scripts", "tests/backend", "main.py"]
strict = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["py_modules"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # trailing-comma rules the formatter already owns
    "CPY001", # one LICENSE covers the tree; a per-file banner is a second copy
    "D",      # docstrings are not the documentation strategy here
    "EM",     # exception messages read better inline than via a named local
    "ISC001", # implicit string concat rule the formatter already owns
    "TRY003", # long messages inside raise are the message, not a helper's job
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["INP001"]       # Decky plugin entry point, not a package member
"py_modules/perigee/cli.py" = ["T201"]  # stdout is the CLI's interface
"scripts/*.py" = ["INP001", "T201"]  # standalone device tool, stdout is its report
"tests/**" = [
    "INP001",  # pytest rootdir layout, no package
    "PLR0913", # test doubles take one argument per behaviour they can fake
    "PLR2004", # the literal a test asserts against is the test
    "S101",    # assert is the point of a test
    "S106",    # throwaway credentials in fixtures
    "SLF001",  # tests may inspect the unit they own
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.format]
docstring-code-format = false
