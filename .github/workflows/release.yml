name: Release

# Publishes the draft release that Release Please created at a tag. Order is what
# makes an interrupted run safe to redispatch at the same tag: verify the tagged
# commit is a promoted main commit, verify the tree carries the tag's version,
# build the zip through the exact targets CI validated, attach it, and only then
# flip the release out of draft. Reruns converge: an already-published release
# is left untouched.
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # The dispatch input is untrusted, so it must name an exact vX.Y.Z release
      # whose recorded commit already lives on main: that rejects branch refs,
      # arbitrary tag names, and any commit that never passed review. A draft
      # release holds only the intended tag name (GitHub creates the tag ref on
      # publish), but the release record stores the commit in both states, so
      # read it from there. Main's history comes first so the ancestry test has
      # the graph; the release commit is reachable from it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release commit is a promoted main commit
        id: commit
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            || { echo "release tag must be an exact vX.Y.Z: $TAG" >&2; exit 1; }
          sha="$(gh release view "$TAG" --json targetCommitish --jq .targetCommitish)"
          echo "$sha" | grep -Eq '^[0-9a-f]{40}$' \
            || { echo "release target is not a full commit SHA: $sha" >&2; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main \
            || { echo "release commit $sha is not on main" >&2; exit 1; }
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the verified release commit
        env:
          SHA: ${{ steps.commit.outputs.sha }}
        run: git switch --detach "$SHA"

      # Refuses to publish a v0.2.0 whose tree still says 0.1.0.
      - name: Verify the tagged tree carries the tag's version
        run: make version-check VERSION="${TAG#v}"

      # The same two targets CI runs on every pull request. There is no separate
      # release build recipe to drift from the validated one.
      - name: Build and verify the plugin bundle
        run: |
          make build
          make bundle-check

      # Assets attach while the release is a draft; publishing is the commit
      # point. A rerun that finds it published leaves it alone.
      - name: Attach the plugin zip and publish the release
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          # Everything below 1.0.0 publishes as a pre-release: the plugin has no
          # stability promise yet, and the store is not the consumer of these
          # assets anyway.
          prerelease=false
          case "$TAG" in v0.*) prerelease=true ;; esac
          if [ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = "true" ]; then
            gh release upload "$TAG" out/perigee.zip --clobber
            gh release edit "$TAG" --draft=false --prerelease="$prerelease"
          else
            echo "release $TAG is already published"
          fi
